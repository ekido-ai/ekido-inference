[package]
name = "ekido-inference"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Ekido Inference service: serves customers' finished models behind API keys"
license-file = "../../LICENSE"
publish = false

[dependencies]
actix-web = "4.9"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
